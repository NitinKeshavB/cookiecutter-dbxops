############################
# --- Package Settings --- #
############################

[project]
name = "cookie-cutter-dbx"
description = "My package description"
authors = [{ name = "<your name>", email = "some-email@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6", "jsonschema>=4", "rdflib>=7", "sqlalchemy>=2", "databricks-sdk>=0.64", "loguru>=0.7"]
classifiers = ["Programming Language :: Python :: 3"]
keywords = ["one", "two"]

# version will be derived dynamically from version.txt via setuptools
dynamic = ["version"]

# commands installed with the package; jobs run them with a python_wheel_task
[project.scripts]
dbxops-publish-run = "dbxops.metastore.job_task:main"
dbxops-publish-costs = "dbxops.metastore.job_task:costs_main"
dbxops-deploy-insights = "dbxops.insights.__main__:deploy_main"

# docs: https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#dynamic-metadata
[tool.setuptools.dynamic]
version = { file = "version.txt" }

# optional dependencies can be installed with square brackets, e.g. `pip install my-package[test,static-code-qa]`
[project.optional-dependencies]
test = ["pytest", "pytest-cov", "faker", "sqlglot>=25"]
release = ["build", "twine"]
# metadata database backends (master plan §D); Lakebase uses the postgres extra
uc = ["databricks-sql-connector>=4", "databricks-sqlalchemy>=2"]
postgres = ["psycopg[binary]>=3"]
static-code-qa = [
    "pre-commit<4.6.1",  # 4.6.1+ calls `git ls-files --deduplicate`, which needs git >= 2.31
    "pylint",
    "black",
    "isort",
    "flake8",
    "flake8-docstrings",
    "Flake8-pyproject",
    "radon",
]
# Installing dev depenendencies in your virtual env makes it so that during development VS Code can
# - surface linting errors
# - automatically apply formatting
# - show enhanced autocompletion for stubs libraries
# See .vscode/settings.json to see how VS Code is configured to use these tools
dev = ["cookie-cutter-dbx[test,release,static-code-qa,uc,postgres]"]

[build-system]
# Minimum requirements for the build system to execute.
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# include more than only .py files in the distribution package (wheel)
[tool.setuptools.package-data]
dbxops = ["*.json", "metadata/schemas/*.json", "registry/schemas/*.json", "insights/sql/*.sql"]


##############################
# --- Code Quality Tools --- #
##############################

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: needs external services, e.g. DBXOPS_TEST_PG_URL for PostgreSQL (deselect with '-m \"not integration\"')",
]

[tool.black]
line-length = 119
# regular expression ignoring multiple patterns separated by '|' and newlines
exclude = '''
/(
    \.venv
  | venv
  | framework/lakeflow_framework
)/
'''

[tool.flake8]
docstring-convention = "all"
ignore = ["D107", "D212", "E501", "W503", "W605", "D203", "D100"]
exclude = ["venv", "framework/lakeflow_framework"]
max-line-length = 119

# radon
radon-max-cc = 10

[tool.isort]
profile = "black"
multi_line_output = "VERTICAL_HANGING_INDENT"
force_grid_wrap = 2
line_length = 119
skip_glob = ["framework/lakeflow_framework/*"]

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "trailing-whitespace",
    "missing-function-docstring",
    "consider-using-f-string",
    "import-error",
    "too-few-public-methods",
    "redefined-outer-name",
]
