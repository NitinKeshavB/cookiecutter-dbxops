resources:
  jobs:
    dataops_run:
      name: '[${var.project_id}] dataops run (${bundle.target}${var.logical_env})'
      budget_policy_id: ${var.budget_policy_id}
      tags:
        cost_center: ${var.cost_center}
        region: ${var.region}
        project_id: ${var.project_id}
        bundle: ${bundle.name}
        target: ${bundle.target}
        git_repo: ${bundle.git.origin_url}
        git_ref: ${bundle.git.branch}
        git_sha: ${bundle.git.commit}
      email_notifications:
        on_failure:
        - ${var.notification_email}
      webhook_notifications:
        on_failure:
        - id: ${var.notification_destination_id}
        on_duration_warning_threshold_exceeded:
        - id: ${var.notification_destination_id}
      performance_target: ${var.performance_target}
      queue:
        enabled: true
      environments:
      - environment_key: generate
        spec:
          client: '4'
          dependencies:
          - faker
      - environment_key: platform
        spec:
          client: '4'
          dependencies:
          - databricks-sql-connector
          - ${var.dbxops_wheel_path}
      tasks:
      - task_key: generate_data
        environment_key: generate
        spark_python_task:
          python_file: ../src/jobs/generate_data.py
          parameters:
          - --output
          - /Volumes/${var.catalog}/${var.project_id}_bronze${var.logical_env}/landing
      - task_key: bronze
        depends_on:
        - task_key: generate_data
        pipeline_task:
          pipeline_id: ${resources.pipelines.dataops_bronze.id}
      - task_key: silver
        depends_on:
        - task_key: bronze
        pipeline_task:
          pipeline_id: ${resources.pipelines.dataops_silver.id}
      - task_key: gold
        depends_on:
        - task_key: silver
        pipeline_task:
          pipeline_id: ${resources.pipelines.dataops_gold.id}
      - task_key: publish_run_metadata
        run_if: ALL_DONE
        environment_key: platform
        python_wheel_task:
          package_name: cookie-cutter-dbx
          entry_point: dbxops-publish-run
          parameters:
          - --run-id
          - '{{job.run_id}}'
          - --target
          - ${bundle.target}
          - --repo-id
          - ${var.project_id}
          - --config
          - ${workspace.file_path}/src/config/metastore.yml
        depends_on:
        - task_key: gold
