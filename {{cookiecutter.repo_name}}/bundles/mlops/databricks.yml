# MLOps example bundle: fraud features (materialized view) -> train (MLflow, Unity Catalog model) -> gate -> champion -> batch scores -> serving.
#
# Every value containing PLACEHOLDER is tracked by `make check-placeholders` and blocks deployment until it is replaced.
# catalog, host and framework path per target come from conf/environments.yml (a test keeps them in step);
# <target>_substitutions.json files are generated by `make sync-substitutions`; contracts by `make contracts`.
bundle:
  name: mlops
include:
- resources/*.yml
permissions:
- level: CAN_MANAGE
  group_name: AAD-DBX-EXAMPLECLAIMS-ADMIN
- level: CAN_RUN
  group_name: AAD-DBX-EXAMPLECLAIMS-DEV
- level: CAN_VIEW
  group_name: AAD-DBX-EXAMPLECLAIMS-READ
variables:
  project_id:
    description: Project id; every schema is <project_id>_<layer>. Must equal project_id in metadata/_platform/repo.yaml
    default: example_claims
  catalog:
    description: Unity Catalog catalog of the target (conf/environments.yml)
  logical_env:
    description: Suffix that isolates a developer's schemas in dev; empty elsewhere (starts with '_')
    default: ''
  workspace_host:
    description: Workspace URL, passed to the framework for API calls
  framework_source_path:
    description: 'Deployed framework src folder: /Workspace/Shared/.bundle/lakeflow_framework/<target>/<version>/files/src'
  service_principal_application_id:
    description: Application id the non-dev targets run as (metadata/_platform/repo.yaml)
  cost_center:
    description: Cost centre tag (metadata/_platform/repo.yaml tags)
  region:
    description: Region tag (metadata/_platform/repo.yaml tags)
  budget_policy_id:
    description: Serverless budget policy of this project; its tags attribute serverless cost (set by the platform team)
  notification_destination_id:
    description: Workspace notification destination (Microsoft Teams) for failures and duration warnings
  notification_email:
    description: Email address (or distribution list) told about failed runs
  performance_target:
    description: Serverless job performance target
    default: STANDARD
  dbxops_wheel_path:
    description: Path of the dbxops wheel on a UC volume, installed in the job environment; set by CI
    default: ''
  deploy_serving:
    description: "'true' where the model serving endpoint is reconciled (uat, preprod, prod); 'false' elsewhere"
    default: 'false'
targets:
  dev:
    mode: development
    workspace:
      host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
    variables:
      catalog: <PLACEHOLDER-dev-catalog>
      workspace_host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      framework_source_path: /Workspace/Shared/.bundle/lakeflow_framework/dev/v0.24.1/files/src
      cost_center: <PLACEHOLDER-cost-center>
      region: <PLACEHOLDER-region>
      budget_policy_id: <PLACEHOLDER-budget-policy-id>
      notification_destination_id: <PLACEHOLDER-teams-notification-destination-id>
      notification_email: <PLACEHOLDER-notification-email>
      logical_env: _${workspace.current_user.short_name}
    default: true
  test:
    mode: production
    workspace:
      host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: <PLACEHOLDER-test-catalog>
      workspace_host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      framework_source_path: /Workspace/Shared/.bundle/lakeflow_framework/test/v0.24.1/files/src
      cost_center: <PLACEHOLDER-cost-center>
      region: <PLACEHOLDER-region>
      budget_policy_id: <PLACEHOLDER-budget-policy-id>
      notification_destination_id: <PLACEHOLDER-teams-notification-destination-id>
      notification_email: <PLACEHOLDER-notification-email>
      service_principal_application_id: <PLACEHOLDER-project-sp-application-id>
    run_as:
      service_principal_name: ${var.service_principal_application_id}
  uat:
    mode: production
    workspace:
      host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: <PLACEHOLDER-uat-catalog>
      workspace_host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      framework_source_path: /Workspace/Shared/.bundle/lakeflow_framework/uat/v0.24.1/files/src
      deploy_serving: 'true'
      cost_center: <PLACEHOLDER-cost-center>
      region: <PLACEHOLDER-region>
      budget_policy_id: <PLACEHOLDER-budget-policy-id>
      notification_destination_id: <PLACEHOLDER-teams-notification-destination-id>
      notification_email: <PLACEHOLDER-notification-email>
      service_principal_application_id: <PLACEHOLDER-project-sp-application-id>
    run_as:
      service_principal_name: ${var.service_principal_application_id}
  preprod:
    mode: production
    workspace:
      host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: <PLACEHOLDER-preprod-catalog>
      workspace_host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      framework_source_path: /Workspace/Shared/.bundle/lakeflow_framework/preprod/v0.24.1/files/src
      deploy_serving: 'true'
      cost_center: <PLACEHOLDER-cost-center>
      region: <PLACEHOLDER-region>
      budget_policy_id: <PLACEHOLDER-budget-policy-id>
      notification_destination_id: <PLACEHOLDER-teams-notification-destination-id>
      notification_email: <PLACEHOLDER-notification-email>
      service_principal_application_id: <PLACEHOLDER-project-sp-application-id>
      performance_target: PERFORMANCE_OPTIMIZED
    run_as:
      service_principal_name: ${var.service_principal_application_id}
  prod:
    mode: production
    workspace:
      host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: <PLACEHOLDER-prod-catalog>
      workspace_host: https://<PLACEHOLDER-workspace-host>.azuredatabricks.net
      framework_source_path: /Workspace/Shared/.bundle/lakeflow_framework/prod/v0.24.1/files/src
      deploy_serving: 'true'
      cost_center: <PLACEHOLDER-cost-center>
      region: <PLACEHOLDER-region>
      budget_policy_id: <PLACEHOLDER-budget-policy-id>
      notification_destination_id: <PLACEHOLDER-teams-notification-destination-id>
      notification_email: <PLACEHOLDER-notification-email>
      service_principal_application_id: <PLACEHOLDER-project-sp-application-id>
      performance_target: PERFORMANCE_OPTIMIZED
    run_as:
      service_principal_name: ${var.service_principal_application_id}
